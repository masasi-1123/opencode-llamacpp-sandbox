version: "3.8"

services:
  # ============================================================================
  # 1. llama.cpp サーバー (CUDA GPU & MoE CPUハイブリッド推論基盤)
  # ============================================================================
  llama-cpp:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: llama-cpp
    ports:
      - "8081:8080" # ホスト側8081からAPI確認可能 (OpenAI互換 /v1)
    volumes:
      - ./presets.ini:/presets.ini:ro
      - ./models:/models # ホストのGGUFモデル配置用
      - ollama_data:/root/.ollama:ro # Ollamaの既存モデルBlobを参照
    ulimits:
      memlock:
        soft: -1
        hard: -1
    environment:
      - LLAMA_ARG_HOST=0.0.0.0
      - LLAMA_ARG_PORT=8080
      - LLAMA_ARG_MODELS_PRESET=/presets.ini
      - LLAMA_ARG_MODELS_MAX=1       # 同時ロードを1つに制限してVRAM保護
      - LLAMA_ARG_JINJA=true         # Jinjaチャットテンプレートを有効化
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ============================================================================
  # 2. OpenCode サンドボックス (ホスト環境を汚さない使い捨て開発環境)
  # ============================================================================
  opencode-sandbox:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: opencode-sandbox
    restart: unless-stopped
    tty: true
    stdin_open: true
    command: ["/bin/bash"]
    environment:
      - LLM_BASE_URL=http://llama-cpp:8080/v1
      - LLAMA_CPP_BASE_URL=http://llama-cpp:8080/v1
      - DEFAULT_MODEL=ornith-1.5:35B
      - OPENAI_BASE_URL=http://llama-cpp:8080/v1
      - OPENAI_API_KEY=dummy
    volumes:
      # 作業コードの永続化（ホストのカレント ./workspace と同期）
      - ./workspace:/home/workspace
      # OpenCode設定の永続化
      - ./opencode-config:/home/openvscode-server/.config/opencode
      # npmパッケージ・キャッシュの永続化（再起動時の再ダウンロードを防止）
      - opencode_data:/home/openvscode-server/.local/share/opencode
      - opencode_cache:/home/openvscode-server/.cache/opencode
      # モデル切り替えツール (switch-model) のマウント
      - ./switch-model.py:/usr/local/bin/switch-model:ro
      - ./switch-model.py:/home/openvscode-server/switch-model.py:ro
    depends_on:
      - llama-cpp

volumes:
  ollama_data:
  opencode_data:
  opencode_cache:
