version = 1

# ==============================================================================
# 全モデル共通設定 (ワイルドカード [*])
# ==============================================================================
[*]
n-gpu-layers = 99          # 基本層をGPU(VRAM)へオフロード
flash-attn = on            # Flash Attention有効化（VRAM削減＆高速化）
cache-type-k = q4_0        # KVキャッシュ(Key)の4bit量子化
cache-type-v = q4_0        # KVキャッシュ(Value)の4bit量子化
ctx-size = 65536           # エージェントの長文コード解析に必要なコンテキスト長(64k)
parallel = 1               # 並行推論スロット数
batch-size = 1024          # プロンプト処理バッチサイズ
ubatch-size = 1024         # 物理バッチサイズ
fit = off                  # 自動コンテキスト縮小を無効化
sleep-idle-seconds = 900   # アイドル時スリープまでの秒数
jinja = true               # チャットテンプレートにJinjaを使用
models-max = 1             # 同時ロード可能モデル数（VRAM保護のため1）

# ==============================================================================
# 個別モデル定義
# ==============================================================================

# --- 例1: ./models フォルダ内のGGUFモデルをロードする場合 ---
# [my-custom-coder]
# model = /models/Qwen2.5-Coder-14B-Instruct-Q4_K_M.gguf
# n-gpu-layers = 99

# --- 例2: MoE (Mixture of Experts) モデルの省メモリ設定 ---
# Attention層などはGPU(VRAM)に置き、巨大なExpert重みのみCPU(メインRAM)へオフロード
# VRAM 12GBでも35B超のモデルがメモリ不足にならず高速動作
[ornith-1.5:35b]
model = /root/.ollama/models/blobs/sha256-aaeb640f98a892980ef54876024293cc8d6987a86523aa1b947ffa9274ef800a
n-gpu-layers = 99
n-cpu-moe = 999            # ★全MoE層のExpert重みをメインRAM(CPU)へオフロード
threads = 6                # ホストの物理CPUコア数に合わせる

[gemma4:26b]
model = /root/.ollama/models/blobs/sha256-dfd98d2734212d0c128e128e5d88edac764aaa4f4af2f4c196941f2354aab8da
n-gpu-layers = 99
n-cpu-moe = 999
threads = 6

# --- 例3: Denseモデル (全層GPUロード) ---
[qwen2.5-coder:14b]
model = /root/.ollama/models/blobs/sha256-ac9bc7a69dab38da1c790838955f1293420b55ab555ef6b4615efa1c1507b1ed
n-gpu-layers = 99

[ornith:9b]
model = /root/.ollama/models/blobs/sha256-af63361d2ac3ba2cb454f440842e345b926a50fe89cbdbe6a55160f32fc28e93
n-gpu-layers = 99
